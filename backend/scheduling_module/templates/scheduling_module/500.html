{% extends 'base.html' %}

{% block title %}خطای سرور - سامانه زمان‌بندی{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card border-danger">
            <div class="card-body py-5">
                <i class="bi bi-bug display-1 text-danger"></i>
                <h1 class="display-4 text-danger">۵۰۰</h1>
                <h3 class="text-danger">خطای داخلی سرور</h3>
                <p class="text-muted mt-3">
                    متأسفانه خطایی در سرور رخ داده است. لطفاً稍后再试或联系管理员。
                </p>

                <div class="mt-4">
                    <a href="{% url 'panel:dashboard' %}" class="btn btn-primary me-2">
                        <i class="bi bi-house"></i>
                        بازگشت به داشبورد
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-clockwise"></i>
                        بارگذاری مجدد
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
